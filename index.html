<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Broke But Functional — Survive on ₹10K | Gen Z Personal Finance</title>
    <meta name="description" content="Survive 30 days on ₹10,000. Gen Z personal finance app with cashflow forecasting, committed bills tracking, interactive survival calendar, and simulated connectors." />
    <link rel="canonical" href="https://broke-but-functional-five.vercel.app/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Theme Color for light and dark modes -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4EFE6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B1511" />

    <!-- Critical Font Preload (Hero balance number uses JetBrains Mono) -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/jetbrains-mono-latin.woff2"
      crossorigin="anonymous"
    />

    <!-- Inline script to default to light theme (clean first paint without flash) -->
    <script>
      (function() {
        try {
          document.documentElement.classList.remove('dark');
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
